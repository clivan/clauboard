<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Clauboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
    <div class="logo">CLAU<span>BOARD</span></div>
    <div class="tabs">
        <button class="tab active" data-view="projects">Proyectos</button>
        <button class="tab" data-view="applications">Aplicaciones</button>
        <button class="tab" data-view="templates">Templates</button>
        <button class="tab" data-view="infrastructure">Infraestructura</button>
    </div>
</div>

<!-- ===== Proyectos ===== -->
<section id="view-projects" class="view">
    <div class="view-header">
        <h2>Proyectos</h2>
        <button class="btn primary" id="btn-new-project">+ Nuevo proyecto</button>
    </div>

    <form id="form-new-project" class="form-panel" hidden>
        <div class="field">
            <label for="p-id">ID</label>
            <input id="p-id" required placeholder="mi-proyecto">
        </div>
        <div class="field">
            <label for="p-name">Nombre</label>
            <input id="p-name" required placeholder="Mi Proyecto">
        </div>
        <div class="field">
            <label for="p-desc">Descripción</label>
            <input id="p-desc" placeholder="opcional">
        </div>
        <div class="field">
            <label for="p-template">Template</label>
            <select id="p-template" required>
                <option value="">Cargando...</option>
            </select>
        </div>
        <div class="field">
            <label for="p-device">Dispositivo (opcional)</label>
            <input id="p-device" placeholder="ej. /dev/ttyUSB0">
        </div>
        <div class="field">
            <label for="p-path">Ruta (opcional)</label>
            <input id="p-path" placeholder="dejar vacío para usar el default">
        </div>
        <button type="submit" class="btn primary">Crear</button>
        <button type="button" class="btn" id="btn-cancel-project">Cancelar</button>
    </form>

    <div id="projects-grid" class="grid"></div>
</section>

<!-- ===== Aplicaciones ===== -->
<section id="view-applications" class="view" hidden>
    <div class="view-header">
        <h2>Aplicaciones</h2>
    </div>
    <div id="applications-grid" class="grid"></div>
</section>

<!-- ===== Templates ===== -->
<section id="view-templates" class="view" hidden>
    <div class="view-header">
        <h2>Templates</h2>
    </div>
    <div id="templates-grid" class="grid"></div>
</section>

<!-- ===== Infraestructura ===== -->
<section id="view-infrastructure" class="view" hidden>
    <div class="view-header">
        <h2>Infraestructura</h2>
    </div>
    <div id="infrastructure-grid" class="grid"></div>
</section>

<!-- ===== Modal clone ===== -->
<div id="clone-backdrop" class="modal-backdrop" hidden>
    <div class="modal">
        <div class="modal-header">
            <span id="clone-title">CLONAR PROYECTO</span>
            <button class="btn" id="clone-close">✕</button>
        </div>
        <div style="padding:16px;display:flex;flex-direction:column;gap:12px;">
            <div class="field">
                <label for="clone-id">Nuevo ID</label>
                <input id="clone-id" placeholder="mi-proyecto-v2">
            </div>
            <div class="field">
                <label for="clone-name">Nuevo nombre</label>
                <input id="clone-name" placeholder="Mi Proyecto v2">
            </div>
            <div class="field">
                <label for="clone-path">Ruta (opcional)</label>
                <input id="clone-path" placeholder="dejar vacío para usar el default">
            </div>
            <div style="display:flex;gap:8px;justify-content:flex-end;">
                <button class="btn" id="clone-cancel">Cancelar</button>
                <button class="btn primary" id="clone-confirm">Clonar</button>
            </div>
        </div>
    </div>
</div>

<!-- ===== Modal (logs / status) ===== -->
<div id="modal-backdrop" class="modal-backdrop" hidden>
    <div class="modal">
        <div class="modal-header">
            <span id="modal-title">OUTPUT</span>
            <div style="display:flex;gap:8px;">
                <button class="btn" id="modal-copy" hidden>Copiar</button>
                <button class="btn" id="modal-close">✕</button>
            </div>
        </div>
        <pre id="modal-body"></pre>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/install-progress.js"></script>
<script src="js/application.js"></script>
<script src="js/project.js"></script>
<script src="js/templates.js"></script>
<script src="js/infrastructure.js"></script>
<script src="app.js"></script>

<!-- Barra de progreso de instalación -->
<div id="install-bar" class="install-bar" hidden>
    <span class="install-bar-label" id="install-bar-label">Instalando...</span>
    <div class="install-bar-track">
        <div class="install-bar-fill" id="install-bar-fill"></div>
    </div>
    <span class="install-bar-pct" id="install-bar-pct">0%</span>
</div>

</body>
</html>
