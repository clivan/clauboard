id: webui

name: Open WebUI

description: >
  Interfaz web para modelos LLM vía Ollama. Requiere que Ollama esté
  corriendo (container_name: ollama) en la misma red clauboard-net.
  Tu vault de Obsidian se monta de solo lectura en /data/obsidian-vault
  para indexarlo vía Workspace > Knowledge en la UI.

type: service

image: ghcr.io/open-webui/open-webui:main

container_name: open-webui

restart: unless-stopped

primary_port: 8080

ports:

  - host: 3001
    container: 8080

volumes:

  - host: /home/claudio/clauboard-data/open-webui
    container: /app/backend/data

  - host: /home/claudio/Clivan
    container: /data/obsidian-vault

environment:

  OLLAMA_BASE_URL: "http://ollama:11434"

labels:

  clauboard.managed: "true"

icon: openwebui.svg