services:
  ros2:
    image: clauboard/ros2-realsense:humble
    container_name: ${PROJECT_NAME}-ros2
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    devices:
      - ${DEVICE}:${DEVICE}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ../src:/workspace/src
      - ../build:/workspace/build
      - ../install:/workspace/install
    stdin_open: true
    tty: true